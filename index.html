<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auriolous Watch</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
    }

    header {
      background: #050505;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #d4af37;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
      font-size: 14px;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(135deg, #111, #1c1c1c);
    }

    .hero h1 {
      font-size: 42px;
      color: #d4af37;
      margin-bottom: 15px;
    }

    .hero p {
      color: #ccc;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: #d4af37;
      color: #000;
      padding: 14px 30px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }

    .products {
      padding: 50px 20px;
      text-align: center;
    }

    .products h2 {
      color: #d4af37;
      margin-bottom: 30px;
      font-size: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: #151515;
      padding: 20px;
      border-radius: 15px;
      border: 1px solid #333;
    }

    .watch {
      height: 220px;
      background: linear-gradient(145deg, #222, #080808);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 80px;
      margin-bottom: 20px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .price {
      color: #d4af37;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #050505;
      color: #aaa;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">AURIOLous WATCH</div>

    <nav>
      <a href="#">Home</a>
      <a href="#shop">Shop</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Auriolous Watch</h1>
    <p>Luxury watches. Timeless style.</p>
    <a href="#shop" class="btn">Shop Now</a>
  </section>

  <section class="products" id="shop">
    <h2>Featured Watches</h2>

    <div class="grid">

      <div class="card">
        <div class="watch">⌚</div>
        <h3>Royal Gold</h3>
        <p class="price">Rs. 12,999</p>
        <a href="#" class="btn">Buy Now</a>
      </div>

      <div class="card">
        <div class="watch">⌚</div>
        <h3>Silver Classic</h3>
        <p class="price">Rs. 9,999</p>
        <a href="#" class="btn">Buy Now</a>
      </div>

      <div class="card">
        <div class="watch">⌚</div>
        <h3>Black Elite</h3>
        <p class="price">Rs. 15,999</p>
        <a href="#" class="btn">Buy Now</a>
      </div>

    </div>
  </section>

  <footer id="contact">
    <p>© 2026 Auriolous Watch. All Rights Reserved.</p>
  </footer>

</body>
</html>
